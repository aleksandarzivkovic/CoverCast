alias: Play album on RFID scan (Living Room CoverCast)
description: >
  Instance of the CoverCast Remote blueprint
  (homeassistant/blueprints/automation/covercast_remote.yaml) for the
  living room CoverCast pod.
use_blueprint:
  path: covercast_remote.yaml
  input:
    rfid_url_sensor: sensor.dnevna_soba_covercast_rfid_album_url
    next_button: binary_sensor.covercast_next
    previous_button: binary_sensor.covercast_previous
    play_pause_button: binary_sensor.covercast_play_pause
    volume_number: number.covercast_volume
    target_media_player: media_player.unnamed_room
